[project]
name = "gatekeep"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible LLM gateway with prompt-eval gating"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "passlib>=1.7",
    "bcrypt>=4.0,<4.1",
    "anthropic>=0.40",
    "ollama>=0.4",
    "openai>=1.50",
    "google-genai>=0.3",
    "redis>=5.0",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "prometheus-client>=0.20",
    "aiosmtplib>=3.0",
]

[project.scripts]
gatekeep = "gatekeep.cli:main"

[project.optional-dependencies]
demo = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
loadtest = [
    "locust>=2.31",
]

# Development-only tools. A PEP 735 dependency group rather than an extra, so
# `uv sync` / `uv run` install it by default and the Docker image (`--no-dev`)
# leaves it out.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Pinned exactly so it matches the ruff-pre-commit rev in .pre-commit-config.yaml.
    "ruff==0.16.4",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gatekeep*"]

[tool.setuptools.package-data]
"gatekeep" = ["data/*.json", "data/*.sha256"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() default-arg pattern is idiomatic here
