name: eval-gate

on:
  pull_request:
    paths:
      - "prompts/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gatekeep
          POSTGRES_PASSWORD: gatekeep
          POSTGRES_DB: gatekeep
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U gatekeep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
    env:
      DATABASE_URL: postgresql+asyncpg://gatekeep:gatekeep@localhost:5432/gatekeep
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.11"
      - name: Check uv.lock is up to date
        run: uv lock --check
      - name: Install
        run: uv sync --frozen
      - name: Run eval gate
        run: uv run --frozen bash scripts/ci-eval-check.sh
